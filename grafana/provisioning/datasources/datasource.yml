# Single Prometheus datasource for the unified exporter test stack.
# uid: prometheus matches what the per-repo bundled dashboards reference.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
