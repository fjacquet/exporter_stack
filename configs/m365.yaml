---
# m365_licenses_exporter — Microsoft 365 license exporter.
# Secret-bearing fields accept ${ENV_VAR} refs, expanded at load. Real values come
# from .env (M365_TENANT_ID, M365_CLIENT_ID, M365_CLIENT_SECRET); config.yaml stays
# the source of truth.

collection:
  interval: 2h            # how often to poll the Graph API

otlp:
  endpoint: ""            # empty disables OTLP; e.g. "otel-collector:4317"
  insecure: false

m365:
  enabled: true
  tenants:
    - instance: primary
      tenantId: ${M365_TENANT_ID}
      clientId: ${M365_CLIENT_ID}
      clientSecret: ${M365_CLIENT_SECRET}
