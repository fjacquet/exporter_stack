---
# exporter_stack — public, self-contained observability for the exporter family.
#
#   cp .env.example .env        # set creds to point at real targets (optional)
#   docker compose up -d
#
#   Grafana     http://localhost:3000   (admin/admin) — one folder per exporter
#   Prometheus  http://localhost:9090   (Status > Targets)
#
# Exporters pull published GHCR images. Dashboards are fetched fresh from each
# exporter's authoritative GitHub repo at startup (never vendored here).
# Targets report up=0 until real creds are set in .env.

services:
  # ===================== dashboard fetcher (one-shot) =====================
  dashboard-fetcher:
    image: alpine:3.20
    container_name: es_dashboard_fetcher
    command: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && sh /scripts/fetch-dashboards.sh"]
    environment:
      - DASHBOARD_REF=${DASHBOARD_REF:-default}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./scripts:/scripts:ro
      - ./dashboards.manifest.txt:/manifest/dashboards.manifest.txt:ro
      - dashboards:/dashboards
    networks: [exporters]
    restart: "no"

  # ===================== exporters (GHCR images) =====================
  idrac_exporter:
    image: ghcr.io/fjacquet/idrac_exporter:${IDRAC_TAG:-latest}
    container_name: es_idrac_exporter
    volumes:
      - ./configs/idrac.yaml:/etc/prometheus/idrac.yml:ro
    environment:
      - IDRAC1_HOST=${IDRAC1_HOST:-192.168.1.1}
      - IDRAC1_USERNAME=${IDRAC1_USERNAME:-root}
      - IDRAC1_PASSWORD=${IDRAC1_PASSWORD:-changeme}
    ports: ["9348:9348"]
    networks: [exporters]
    restart: unless-stopped

  obs_exporter:
    image: ghcr.io/fjacquet/obs_exporter:${OBS_TAG:-latest}
    container_name: es_obs_exporter
    command: ["--config", "/etc/obs_exporter/config.yaml"]
    volumes:
      - ./configs/obs.yaml:/etc/obs_exporter/config.yaml:ro
    environment:
      - OBS1_HOSTNAME=${OBS1_HOSTNAME:-objectscale01.example.com}
      - OBS1_USERNAME=${OBS1_USERNAME:-obs-monitor}
      - OBS1_PASSWORD=${OBS1_PASSWORD:-changeme}
    ports: ["9438:9438"]
    networks: [exporters]
    restart: unless-stopped

  nbu_exporter:
    image: ghcr.io/fjacquet/nbu_exporter:${NBU_TAG:-latest}
    container_name: es_nbu_exporter
    security_opt:
      - no-new-privileges:true
    command: ["--config", "/etc/nbu_exporter/config.yaml"]
    volumes:
      - ./configs/nbu.yaml:/etc/nbu_exporter/config.yaml:ro
    environment:
      - NBU1_HOSTNAME=${NBU1_HOSTNAME:-master.my.domain}
      - NBU1_APIKEY=${NBU1_APIKEY:-changeme}
    ports: ["9440:9440"]
    networks: [exporters]
    restart: unless-stopped

  ppdd_exporter:
    image: ghcr.io/fjacquet/ppdd_exporter:${PPDD_TAG:-latest}
    container_name: es_ppdd_exporter
    command: ["--config", "/etc/ppdd_exporter/config.yaml"]
    volumes:
      - ./configs/ppdd.yaml:/etc/ppdd_exporter/config.yaml:ro
    environment:
      - PPDD1_HOSTNAME=${PPDD1_HOSTNAME:-ppdd01.example.com}
      - PPDD1_USERNAME=${PPDD1_USERNAME:-ppdd-monitor}
      - PPDD1_PASSWORD=${PPDD1_PASSWORD:-changeme}
    ports: ["9441:9441"]
    networks: [exporters]
    restart: unless-stopped

  ppdm_exporter:
    image: ghcr.io/fjacquet/ppdm_exporter:${PPDM_TAG:-latest}
    container_name: es_ppdm_exporter
    command: ["--config", "/etc/ppdm_exporter/config.yaml"]
    volumes:
      - ./configs/ppdm.yaml:/etc/ppdm_exporter/config.yaml:ro
    environment:
      - PPDM1_HOSTNAME=${PPDM1_HOSTNAME:-ppdm01.example.com}
      - PPDM1_USERNAME=${PPDM1_USERNAME:-ppdm-monitor}
      - PPDM1_PASSWORD=${PPDM1_PASSWORD:-changeme}
    ports: ["9442:9442"]
    networks: [exporters]
    restart: unless-stopped

  pmax_exporter:
    image: ghcr.io/fjacquet/pmax_exporter:${PMAX_TAG:-latest}
    container_name: es_pmax_exporter
    command: ["--config", "/etc/pmax_exporter/config.yaml"]
    volumes:
      - ./configs/pmax.yaml:/etc/pmax_exporter/config.yaml:ro
    environment:
      - PMAX1_HOSTNAME=${PMAX1_HOSTNAME:-unisphere01.example.com}
      - PMAX1_USERNAME=${PMAX1_USERNAME:-pmax-monitor}
      - PMAX1_PASSWORD=${PMAX1_PASSWORD:-changeme}
    ports: ["9443:9443"]
    networks: [exporters]
    restart: unless-stopped

  pscale_exporter:
    image: ghcr.io/fjacquet/pscale_exporter:${PSCALE_TAG:-latest}
    container_name: es_pscale_exporter
    command: ["--config", "/etc/pscale_exporter/config.yaml"]
    volumes:
      - ./configs/pscale.yaml:/etc/pscale_exporter/config.yaml:ro
    environment:
      - PSCALE1_HOSTNAME=${PSCALE1_HOSTNAME:-pscale-clu1.example.com}
      - PSCALE1_USERNAME=${PSCALE1_USERNAME:-pscale-monitor}
      - PSCALE1_PASSWORD=${PSCALE1_PASSWORD:-changeme}
    ports: ["9444:9444"]
    networks: [exporters]
    restart: unless-stopped

  pflex_exporter:
    image: ghcr.io/fjacquet/pflex_exporter:${PFLEX_TAG:-latest}
    container_name: es_pflex_exporter
    command: ["--config", "/etc/pflex_exporter/config.yaml"]
    volumes:
      - ./configs/pflex.yaml:/etc/pflex_exporter/config.yaml:ro
    environment:
      - PFLEX1_GATEWAY=${PFLEX1_GATEWAY:-flex-clu1-gw01}
      - PFLEX1_USERNAME=${PFLEX1_USERNAME:-flex-username}
      - PFLEX1_PASSWORD=${PFLEX1_PASSWORD:-changeme}
    ports: ["9445:9445"]
    networks: [exporters]
    restart: unless-stopped

  pstore_exporter:
    image: ghcr.io/fjacquet/pstore_exporter:${PSTORE_TAG:-latest}
    container_name: es_pstore_exporter
    command: ["--config", "/etc/pstore_exporter/config.yaml"]
    volumes:
      - ./configs/pstore.yaml:/etc/pstore_exporter/config.yaml:ro
    environment:
      - PSTORE1_HOSTNAME=${PSTORE1_HOSTNAME:-10.0.0.1}
      - PSTORE1_USERNAME=${PSTORE1_USERNAME:-admin}
      - PSTORE1_PASSWORD=${PSTORE1_PASSWORD:-changeme}
    ports: ["9446:9446"]
    networks: [exporters]
    restart: unless-stopped

  nsr_exporter:
    image: ghcr.io/fjacquet/nsr_exporter:${NSR_TAG:-latest}
    container_name: es_nsr_exporter
    command: ["--config", "/etc/nsr_exporter/config.yaml"]
    volumes:
      - ./configs/nsr.yaml:/etc/nsr_exporter/config.yaml:ro
    environment:
      - NSR1_HOST=${NSR1_HOST:-https://networker-prod-01.local:9090}
      - NSR1_USERNAME=${NSR1_USERNAME:-admin}
      - NSR1_PASSWORD=${NSR1_PASSWORD:-changeme}
    ports: ["9447:9447"]
    networks: [exporters]
    restart: unless-stopped

  pve_exporter:
    image: ghcr.io/fjacquet/pve_exporter:${PVE_TAG:-latest}
    container_name: es_pve_exporter
    command: ["--config", "/etc/pve_exporter/config.yaml"]
    volumes:
      - ./configs/pve.yaml:/etc/pve_exporter/config.yaml:ro
    environment:
      - PVE1_HOST=${PVE1_HOST:-10.0.0.1:8006}
      - PVE1_TOKEN_ID=${PVE1_TOKEN_ID:-exporter@pam!prometheus}
      - PVE1_TOKEN_SECRET=${PVE1_TOKEN_SECRET:-changeme}
    ports: ["9221:9221"]
    networks: [exporters]
    restart: unless-stopped

  vmware_licenses_exporter:
    image: ghcr.io/fjacquet/vmware_licenses_exporter:${VMWARE_LICENSES_TAG:-latest}
    container_name: es_vmware_licenses_exporter
    command: ["--config", "/etc/vmware_licenses_exporter/config.yaml"]
    volumes:
      - ./configs/vmware.yaml:/etc/vmware_licenses_exporter/config.yaml:ro
    environment:
      - VC_HOST=${VC_HOST:-https://vcenter.example.com}
      - VC_USERNAME=${VC_USERNAME:-svc-ro}
      - VC_PASSWORD=${VC_PASSWORD:-changeme}
    ports: ["9106:9106"]
    networks: [exporters]
    restart: unless-stopped

  m365_licenses_exporter:
    image: ghcr.io/fjacquet/m365_licenses_exporter:${M365_LICENSES_TAG:-latest}
    container_name: es_m365_licenses_exporter
    command: ["--config", "/etc/m365_licenses_exporter/config.yaml"]
    volumes:
      - ./configs/m365.yaml:/etc/m365_licenses_exporter/config.yaml:ro
    environment:
      - M365_TENANT_ID=${M365_TENANT_ID:-00000000-0000-0000-0000-000000000000}
      - M365_CLIENT_ID=${M365_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      - M365_CLIENT_SECRET=${M365_CLIENT_SECRET:-changeme}
    ports: ["9105:9105"]
    networks: [exporters]
    restart: unless-stopped

  veeam_licenses_exporter:
    image: ghcr.io/fjacquet/veeam_licenses_exporter:${VEEAM_LICENSES_TAG:-latest}
    container_name: es_veeam_licenses_exporter
    command: ["--config", "/etc/veeam_licenses_exporter/config.yaml"]
    volumes:
      - ./configs/veeam.yaml:/etc/veeam_licenses_exporter/config.yaml:ro
    environment:
      - VEEAM_EM_HOST=${VEEAM_EM_HOST:-https://em.example.com:9398}
      - VEEAM_USERNAME=${VEEAM_USERNAME:-veeam-monitor}
      - VEEAM_PASSWORD=${VEEAM_PASSWORD:-changeme}
    ports: ["9107:9107"]
    networks: [exporters]
    restart: unless-stopped

  node_exporter:
    image: quay.io/prometheus/node-exporter:${NODE_TAG:-latest}
    container_name: es_node_exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro'
    ports: ["9100:9100"]
    networks: [exporters]
    restart: unless-stopped

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:${POSTGRES_TAG:-latest}
    container_name: es_postgres_exporter
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_DSN:-postgresql://postgres:changeme@postgres.example.com:5432/postgres?sslmode=disable}
    ports: ["9187:9187"]
    networks: [exporters]
    restart: unless-stopped

  mysqld_exporter:
    image: quay.io/prometheus/mysqld-exporter:${MYSQLD_TAG:-latest}
    container_name: es_mysqld_exporter
    command:
      - '--config.my-cnf=/etc/mysqld_exporter/.my.cnf'
      - '--mysqld.address=${MYSQL_ADDRESS:-mysql.example.com:3306}'
    volumes:
      - ./configs/mysqld.cnf:/etc/mysqld_exporter/.my.cnf:ro
    ports: ["9104:9104"]
    networks: [exporters]
    restart: unless-stopped

  mongodb_exporter:
    # percona/mongodb_exporter has no :latest tag — pin a version
    image: percona/mongodb_exporter:${MONGODB_TAG:-0.51.0}
    container_name: es_mongodb_exporter
    command:
      - '--mongodb.uri=${MONGODB_URI:-mongodb://exporter:changeme@mongodb.example.com:27017}'
      - '--collect-all'
    ports: ["9216:9216"]
    networks: [exporters]
    restart: unless-stopped

  mssql_exporter:
    image: awaragi/prometheus-mssql-exporter:${MSSQL_TAG:-latest}
    container_name: es_mssql_exporter
    environment:
      - SERVER=${MSSQL_SERVER:-mssql.example.com}
      - PORT=${MSSQL_PORT:-1433}
      - USERNAME=${MSSQL_USERNAME:-sa}
      - PASSWORD=${MSSQL_PASSWORD:-changeme}
      - EXPOSE=4000
    ports: ["4000:4000"]
    networks: [exporters]
    restart: unless-stopped

  redis_exporter:
    image: oliver006/redis_exporter:${REDIS_TAG:-latest}
    container_name: es_redis_exporter
    environment:
      - REDIS_ADDR=${REDIS_ADDR:-redis://redis.example.com:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    ports: ["9121:9121"]
    networks: [exporters]
    restart: unless-stopped

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:${NGINX_TAG:-latest}
    container_name: es_nginx_exporter
    command:
      - '--nginx.scrape-uri=${NGINX_SCRAPE_URI:-http://nginx.example.com:8080/stub_status}'
    ports: ["9113:9113"]
    networks: [exporters]
    restart: unless-stopped

  apache_exporter:
    image: quay.io/lusitaniae/apache-exporter:${APACHE_TAG:-latest}
    container_name: es_apache_exporter
    command:
      - '--scrape_uri=${APACHE_SCRAPE_URI:-http://apache.example.com/server-status?auto}'
    ports: ["9117:9117"]
    networks: [exporters]
    restart: unless-stopped

  haproxy_exporter:
    image: quay.io/prometheus/haproxy-exporter:${HAPROXY_TAG:-latest}
    container_name: es_haproxy_exporter
    command:
      - '--haproxy.scrape-uri=${HAPROXY_SCRAPE_URI:-http://haproxy.example.com:8404/haproxy?stats;csv}'
    ports: ["9101:9101"]
    networks: [exporters]
    restart: unless-stopped

  rabbitmq_exporter:
    image: kbudde/rabbitmq-exporter:${RABBITMQ_TAG:-latest}
    container_name: es_rabbitmq_exporter
    environment:
      - RABBIT_URL=${RABBIT_URL:-http://rabbitmq.example.com:15672}
      - RABBIT_USER=${RABBIT_USER:-monitoring}
      - RABBIT_PASSWORD=${RABBIT_PASSWORD:-changeme}
    ports: ["9419:9419"]
    networks: [exporters]
    restart: unless-stopped

  kafka_exporter:
    image: danielqsj/kafka-exporter:${KAFKA_TAG:-latest}
    container_name: es_kafka_exporter
    command:
      - '--kafka.server=${KAFKA_SERVER:-kafka.example.com:9092}'
    ports: ["9308:9308"]
    networks: [exporters]
    restart: unless-stopped

  stackdriver_exporter:
    image: quay.io/prometheuscommunity/stackdriver-exporter:${STACKDRIVER_TAG:-latest}
    container_name: es_stackdriver_exporter
    command:
      - '--google.project-ids=${GCP_PROJECT_ID:-my-gcp-project}'
      - '--monitoring.metrics-type-prefixes=compute.googleapis.com/instance/cpu'
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
    ports: ["9255:9255"]
    networks: [exporters]
    restart: unless-stopped

  azure_exporter:
    image: quay.io/webdevops/azure-metrics-exporter:${AZURE_TAG:-latest}
    container_name: es_azure_exporter
    environment:
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-00000000-0000-0000-0000-000000000000}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-changeme}
    ports: ["8080:8080"]
    networks: [exporters]
    restart: unless-stopped

  ceph_exporter:
    # amd64-only image — platform pin required on arm64 hosts (e.g. Apple Silicon).
    image: digitalocean/ceph_exporter:${CEPH_TAG:-latest}
    platform: linux/amd64
    container_name: es_ceph_exporter
    volumes:
      - ./configs/ceph.conf:/etc/ceph/ceph.conf:ro
      - ./configs/ceph.keyring:/etc/ceph/keyring:ro
    ports: ["9128:9128"]
    networks: [exporters]
    restart: unless-stopped

  radosgw_exporter:
    image: ghcr.io/pando85/radosgw_usage_exporter:${RADOSGW_TAG:-latest}
    container_name: es_radosgw_exporter
    environment:
      - RADOSGW_SERVER=${RADOSGW_SERVER:-http://radosgw.example.com:7480}
      - ACCESS_KEY=${RADOSGW_ACCESS_KEY:-changeme}
      - SECRET_KEY=${RADOSGW_SECRET_KEY:-changeme}
    ports: ["9242:9242"]
    networks: [exporters]
    restart: unless-stopped

  gluster_exporter:
    # gluster/gluster-prometheus:latest is not published on Docker Hub (denied/unauthorized);
    # substituted the community mirror kurzdigital/gluster-prometheus (same upstream source).
    # amd64-only image (built 2018) — platform pin required on arm64 hosts (e.g. Apple Silicon).
    image: kurzdigital/gluster-prometheus:${GLUSTER_TAG:-latest}
    platform: linux/amd64
    container_name: es_gluster_exporter
    # image's default CMD is a bare /bin/sh (exits immediately) — the exporter binary
    # must be invoked explicitly.
    command: ["/gluster-exporter"]
    volumes:
      - ./configs/gluster-exporter.toml:/etc/gluster-prometheus/gluster-exporter.toml:ro
    ports: ["9713:9713"]
    networks: [exporters]
    restart: unless-stopped

  # ===================== shared observability =====================
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_TAG:-latest}
    container_name: es_alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      # Silences + notification log survive `docker compose down`. /alertmanager
      # is the image's own default --storage.path (and its declared VOLUME).
      - alertmanager_data:/alertmanager
    ports: ["9093:9093"]
    networks: [exporters]
    restart: unless-stopped

  webhook-logger:
    image: mendhak/http-https-echo:${WEBHOOK_LOGGER_TAG:-latest}
    container_name: es_webhook_logger
    environment:
      - HTTP_PORT=8080
    ports: ["9095:8080"]
    networks: [exporters]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: es_prometheus
    # The image's default CMD is exactly
    #   --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    # Setting `command:` REPLACES it, so both flags are reproduced verbatim here;
    # dropping either breaks startup or silently writes the TSDB somewhere the
    # volume does not cover. Retention is bounded on BOTH axes on purpose: time
    # alone lets a busy stack fill the disk, size alone lets a quiet one keep data
    # forever. Whichever bound is hit first wins.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      # Metric history survives `docker compose down`. /prometheus is the image's
      # own default --storage.tsdb.path (and its declared VOLUME + WORKDIR).
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks: [exporters]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: es_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Already the image default; stated explicitly so the volume below and
      # Grafana's SQLite path can never drift apart.
      - GF_PATHS_DATA=/var/lib/grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Grafana's own SQLite DB (users, API keys, dashboard edits, prefs).
      # /var/lib/grafana == GF_PATHS_DATA in the upstream image.
      - grafana_data:/var/lib/grafana
      # Fetched dashboard JSON, mounted *inside* grafana_data. Docker mounts the
      # longer path last, so this shadows the dashboards/ subdir of grafana_data
      # and the one-shot fetcher keeps owning those files.
      - dashboards:/var/lib/grafana/dashboards
    ports: ["3000:3000"]
    networks: [exporters]
    depends_on:
      dashboard-fetcher:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    restart: unless-stopped

networks:
  exporters:
    driver: bridge

volumes:
  # Dashboard JSON, refilled from upstream on every `up` by dashboard-fetcher.
  dashboards:
  # State that must survive a reboot. Named volumes (not bind mounts) on purpose:
  # prometheus/alertmanager run as uid 65534 and grafana as uid 472, and a named
  # volume is chowned by Docker on first use — a host bind mount would need a
  # manual chown per path. `docker compose down` keeps these; only `down -v` wipes.
  prometheus_data:
  grafana_data:
  alertmanager_data:
