route:
  receiver: webhook-logger
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: webhook-logger
    webhook_configs:
      - url: 'http://webhook-logger:8080/'
        send_resolved: true

